<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="rv-title">
  <title id="rv-title">Runtime verification: PLC program organization units to monitor verdict</title>
  <defs>
    <linearGradient id="rv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#e8ecf3"/>
    </linearGradient>
    <marker id="rv-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="720" height="200" fill="url(#rv-bg)" rx="8"/>
  <text x="360" y="28" text-anchor="middle" fill="#5c6b7e" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">Runtime verification path (safe POUs)</text>
  <rect x="32" y="52" width="140" height="56" rx="6" fill="#fff" stroke="#0d9488" stroke-width="2"/>
  <text x="102" y="78" text-anchor="middle" fill="#1a2332" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">PLC code</text>
  <text x="102" y="96" text-anchor="middle" fill="#5c6b7e" font-family="Segoe UI, sans-serif" font-size="10">Program org. units</text>
  <path d="M180 80 L220 80" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#rv-arrow)"/>
  <rect x="228" y="48" width="160" height="64" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="308" y="76" text-anchor="middle" fill="#1a2332" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Specification</text>
  <text x="308" y="94" text-anchor="middle" fill="#5c6b7e" font-family="Segoe UI, sans-serif" font-size="10">Expected behaviour</text>
  <path d="M392 80 L432 80" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#rv-arrow)"/>
  <rect x="440" y="44" width="120" height="72" rx="6" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-width="2"/>
  <text x="500" y="78" text-anchor="middle" fill="#0f766e" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">RV monitor</text>
  <text x="500" y="98" text-anchor="middle" fill="#1a2332" font-family="Segoe UI, sans-serif" font-size="10">Online trace check</text>
  <path d="M564 80 L604 80" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#rv-arrow)"/>
  <rect x="612" y="52" width="76" height="56" rx="6" fill="#fff" stroke="#1a2332" stroke-width="2"/>
  <text x="650" y="82" text-anchor="middle" fill="#1a2332" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Verdict</text>
  <text x="650" y="98" text-anchor="middle" fill="#5c6b7e" font-family="Segoe UI, sans-serif" font-size="9">Pass / fail</text>
  <text x="360" y="168" text-anchor="middle" fill="#5c6b7e" font-family="JetBrains Mono, Consolas, monospace" font-size="9">Fig. · Logical dataflow (not vendor-specific)</text>
</svg>
