<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="rml-title">
  <title id="rml-title">RMLGym: reward machine connects formal objectives to RL training</title>
  <defs>
    <marker id="rml-arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#7c3aed"/>
    </marker>
    <marker id="rml-arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="720" height="200" fill="#f4f6f9" rx="8"/>
  <text x="360" y="26" text-anchor="middle" fill="#5c6b7e" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">RMLGym · explicit objectives in RL</text>
  <rect x="36" y="52" width="140" height="64" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="106" y="80" text-anchor="middle" fill="#1a2332" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Reward machine</text>
  <text x="106" y="100" text-anchor="middle" fill="#5c6b7e" font-family="Segoe UI, sans-serif" font-size="9">Formal spec of rewards</text>
  <path d="M181 84 L231 84" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#rml-arrow-violet)"/>
  <rect x="238" y="48" width="124" height="72" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="78" text-anchor="middle" fill="#5b21b6" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">RMLGym API</text>
  <text x="300" y="98" text-anchor="middle" fill="#5c6b7e" font-family="Segoe UI, sans-serif" font-size="9">Gym-style interface</text>
  <path d="M365 84 L415 84" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#rml-arrow-teal)"/>
  <rect x="422" y="56" width="110" height="56" rx="6" fill="#fff" stroke="#0d9488" stroke-width="2"/>
  <text x="477" y="82" text-anchor="middle" fill="#1a2332" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">RL policy</text>
  <text x="477" y="100" text-anchor="middle" fill="#5c6b7e" font-family="Segoe UI, sans-serif" font-size="9">Train / eval</text>
  <path d="M535 84 L575 84" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#rml-arrow-teal)"/>
  <rect x="582" y="52" width="102" height="64" rx="6" fill="#fff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="633" y="82" text-anchor="middle" fill="#1a2332" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Environment</text>
  <text x="633" y="100" text-anchor="middle" fill="#5c6b7e" font-family="Segoe UI, sans-serif" font-size="9">Steps · reward signal</text>
  <text x="360" y="168" text-anchor="middle" fill="#5c6b7e" font-family="JetBrains Mono, monospace" font-size="9">Fig. · Reward structure stays inspectable across runs</text>
</svg>
